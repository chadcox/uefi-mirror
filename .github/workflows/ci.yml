name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          # Ruff is pinned: an unpinned linter turns someone else's release
          # into a red build on a commit that changed nothing.
          pip install pytest "ruff==0.16.4"

      # The read-only contract is the point of this tool, so it is checked
      # first and also standalone: test_safety.py runs without pytest and
      # without root, exactly as a reviewer would run it from a clone.
      - name: Safety contract (standalone)
        run: python tests/test_safety.py

      - name: Tests
        run: pytest -q

      - name: Lint
        run: ruff check .

      # Diagnostic only, never gates the build. Exercises the real native ABI on
      # a hosted Windows runner -- GetFirmwareType, SeSystemEnvironmentPrivilege,
      # the NtEnumerateSystemEnvironmentValuesEx syscall, and owner-only DACL
      # creation -- which the synthetic parser fixtures cannot. Hosted runners may
      # restrict firmware-variable access, so this is continue-on-error: it tells
      # us how far the path gets and surfaces any ctypes signature/struct crash,
      # but real-hardware validation still lives in docs/windows-validation.md.
      - name: Windows native firmware smoke (diagnostic, non-fatal)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: |
          python -m uefi_mirror.cli probe
          python -m uefi_mirror.cli snapshot -o "${{ runner.temp }}\fw-snap"
