name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Tag matches the package version triple
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "v$version" = "$GITHUB_REF_NAME"
          grep -q "__version__ = \"$version\"" src/uefi_mirror/__init__.py
          grep -q "^## $version " CHANGELOG.md
      - name: Install package and pinned gate tools
        run: python -m pip install -e . pytest "ruff==0.16.4" build
      - name: Safety contract
        run: python tests/test_safety.py
      - name: Test suite
        run: pytest -q
      - name: Lint
        run: ruff check .
      - run: python -m build
      - name: Smoke-install the wheel
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          test "$(/tmp/smoke/bin/uefi-mirror --version)" = "uefi-mirror ${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Extract this version's changelog section
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            index($0, "## " v " ") == 1 {p=1}
            p && /^## / && index($0, "## " v " ") != 1 {exit}
            p' CHANGELOG.md > notes.md
          test -s notes.md
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; not recreating it."
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag \
              --title "uefi-mirror ${GITHUB_REF_NAME#v}" \
              --notes-file notes.md
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
