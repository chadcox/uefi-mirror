[project]
name = "uefi-mirror"
version = "0.4.0"
description = "Read-only cross-platform exporter for live UEFI/BIOS settings"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["typer>=0.12", "rich>=13"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Hardware",
    "Topic :: System :: Systems Administration",
]

[project.scripts]
uefi-mirror = "uefi_mirror.cli:app"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Name the rules. Ruff's implicit default set changes between releases, and a
# CI lint that fails on style the repo never opted into is just noise.
select = ["E4", "E7", "E9", "F", "I", "W"]
